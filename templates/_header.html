<!-- Header shared by every page (each page includes this file) -->
<header>

    <!-- Project logo/name. Clicking it goes back to the first page. -->
    <a href="/" class="brand"><img src="{{ url_for('static', filename='logo.svg') }}" alt="" class="brand-logo" width="32" height="32">Study<span>Shelf</span></a>

    <!-- Right side of the header -->
    <div class="nav-actions">
        {% if is_admin %}
        <span class="admin-badge">Admin</span>

        {% if show_add %}
        <!-- "Add Note" is shown only on a course page, because a note belongs to one course -->
        <button id="addNoteBtn" class="pill-btn" aria-label="Add note">
            <span class="icon-circle"><svg class="ico" viewBox="0 0 24 24">
                    <line x1="12" y1="5" x2="12" y2="19" />
                    <line x1="5" y1="12" x2="19" y2="12" />
                </svg></span>
            <span class="pill-text">Add Note</span>
        </button>
        {% endif %}

        <a href="/logout" class="round-btn" title="Logout">
            <svg class="ico" viewBox="0 0 24 24">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                <polyline points="16 17 21 12 16 7" />
                <line x1="21" y1="12" x2="9" y2="12" />
            </svg>
        </a>

        {% elif student %}
        <!-- Logged-in student: dashboard link, notification bell, logout -->
        <a href="/dashboard" class="ss-nav-link">Dashboard</a>

        <div class="ss-bell-wrap" id="ssRoot" data-uid="{{ student.id }}">
            <button type="button" class="round-btn ss-bell" id="ssBell" aria-label="Notifications"
                aria-haspopup="true" aria-expanded="false" aria-controls="ssPanel">
                <svg class="ico" viewBox="0 0 24 24">
                    <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9" />
                    <path d="M13.7 21a2 2 0 0 1-3.4 0" />
                </svg>
                <span class="ss-badge" id="ssBadge" hidden>0</span>
            </button>

            <div class="ss-panel" id="ssPanel" hidden>
                <div class="ss-panel-head">
                    <strong>Notifications</strong>
                    <button type="button" class="ss-link-btn" id="ssMarkAll">Mark all as read</button>
                </div>
                <div class="ss-panel-list" id="ssList" aria-live="polite">
                    <p class="ss-muted ss-pad">Loading...</p>
                </div>
                <div class="ss-panel-foot">
                    <a href="/notifications">View all</a>
                    <a href="/dashboard">Dashboard</a>
                </div>
            </div>
        </div>

        <a href="/student/logout" class="round-btn" title="Log out" aria-label="Log out">
            <svg class="ico" viewBox="0 0 24 24">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                <polyline points="16 17 21 12 16 7" />
                <line x1="21" y1="12" x2="9" y2="12" />
            </svg>
        </a>

        {% endif %}
    </div>
</header>

{% if student %}
<!-- Small pop-ups for new notes. They never block the page. -->
<div class="ss-toasts" id="ssToasts" aria-live="polite"></div>
<script src="{{ url_for('static', filename='student.js') }}" defer></script>
{% endif %}
