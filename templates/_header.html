<!-- Header shared by every page (each page includes this file) -->
<header>

    <!-- Project logo/name. Clicking it goes back to the first page. -->
    <a href="/" class="brand">Study<span>Shelf</span></a>

    <!-- Right side of the header: only the admin has buttons here -->
    <div class="nav-actions">
        {% if is_admin %}
        <span class="admin-badge">Admin</span>

        {% if show_add %}
        <!-- "Add Note" is shown only on a course page, because a note belongs to one course -->
        <button id="addNoteBtn" class="pill-btn">
            <span class="icon-circle"><svg class="ico" viewBox="0 0 24 24">
                    <line x1="12" y1="5" x2="12" y2="19" />
                    <line x1="5" y1="12" x2="19" y2="12" />
                </svg></span>
            Add Note
        </button>
        {% endif %}

        <a href="/logout" class="round-btn" title="Logout">
            <svg class="ico" viewBox="0 0 24 24">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                <polyline points="16 17 21 12 16 7" />
                <line x1="21" y1="12" x2="9" y2="12" />
            </svg>
        </a>
        {% endif %}
    </div>
</header>
